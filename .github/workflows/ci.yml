name: Build Tetris.Desktop

on:
  push:
    branches:
      - trunk
  pull_request:
    branches:
      - trunk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Check out the repository code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Setup .NET Core SDK
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0' # Replace with the version of .NET you are targeting

      # Restore dependencies
      - name: Restore dependencies
        run: dotnet restore Tetris/Tetris.Desktop/Tetris.Desktop.csproj

      # Build the application
      - name: Build Tetris.Desktop
        run: dotnet build Tetris/Tetris.Desktop/Tetris.Desktop.csproj --configuration Release --no-restore
      
      - name: Publish executable
        run: dotnet publish Tetris/Tetris.Desktop/Tetris.Desktop.csproj --configuration Release --self-contained -r win-x64 -p:PublishSingleFile=true -o ./publish

      # Upload the build artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: Tetris.Desktop-exe
          path: ./publish/Tetris.Desktop.exe
